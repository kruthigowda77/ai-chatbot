<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

    <!-- Login / sign-up screen (shown when not logged in) -->
    <div id="auth-screen" class="auth-screen" hidden>
        <form id="auth-form" class="auth-card" novalidate>
            <div class="auth-logo">🤖</div>
            <h1 id="auth-title">Welcome back</h1>
            <p id="auth-subtitle" class="auth-subtitle">Log in to continue your chats.</p>

            <label for="auth-username">Username</label>
            <input
                id="auth-username"
                name="username"
                autocomplete="username"
                minlength="3"
                maxlength="30"
                required
            >

            <label for="auth-password">Password</label>
            <input
                id="auth-password"
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                maxlength="128"
                required
            >

            <p id="auth-error" class="auth-error" role="alert" hidden></p>

            <button type="submit" id="auth-submit" class="auth-submit">Log in</button>

            <p class="auth-switch">
                <span id="auth-switch-text">New here?</span>
                <button type="button" id="auth-switch-button" class="link-button">Create an account</button>
            </p>
        </form>
    </div>

    <!-- The chat app (shown when logged in) -->
    <div id="chat-app" class="chat-app" hidden>

        <aside id="sidebar" class="sidebar" aria-label="Conversations and documents">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <button type="button" id="new-chat-button" class="new-chat-button">+ New chat</button>
            </div>
            <ul id="conversation-list" class="conversation-list"></ul>
            <p id="conversation-empty" class="conversation-empty">No saved chats yet.</p>

            <!-- Documents (Step 21) -->
            <section class="documents-panel" aria-labelledby="documents-heading">
                <div class="documents-header">
                    <h2 id="documents-heading">Documents</h2>
                    <button type="button" id="upload-button" class="upload-button">⬆ Upload</button>
                    <input
                        type="file"
                        id="file-input"
                        accept=".pdf,.txt,.md"
                        hidden
                    >
                </div>
                <p id="upload-status" class="upload-status" role="status" hidden></p>
                <ul id="document-list" class="document-list"></ul>
                <p id="document-empty" class="document-empty">Upload a PDF, TXT, or MD file to ask questions about it.</p>
            </section>

            <div class="sidebar-footer">
                <span id="user-name" class="user-name"></span>
                <button type="button" id="logout-button" class="logout-button">Log out</button>
            </div>
        </aside>

        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

        <section class="chat-main">
            <header class="chat-header">
                <button
                    type="button"
                    id="menu-button"
                    class="menu-button"
                    aria-label="Show conversations"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >☰</button>
                <div class="bot-avatar" id="bot-avatar">🤖</div>
                <div>
                    <h1 id="bot-name">AI Assistant</h1>
                    <p class="status" id="status">Online</p>
                </div>
            </header>

            <main id="messages" class="messages"></main>

            <!-- Switches: use my documents (Step 21), search the web (Step 22) -->
            <div class="chat-tools">
                <button
                    type="button"
                    id="docs-toggle"
                    class="docs-toggle"
                    aria-pressed="false"
                >📄 Use my documents</button>
                <button
                    type="button"
                    id="web-toggle"
                    class="docs-toggle"
                    aria-pressed="false"
                >🌐 Search the web</button>
            </div>

            <form id="chat-form" class="chat-input">
                <textarea
                    id="message-input"
                    placeholder="Type your message..."
                    rows="1"
                    maxlength="4000"
                    required
                ></textarea>
                <button type="submit" id="send-button">Send</button>
            </form>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="script.js?v=13"></script>
</body>
</html>
